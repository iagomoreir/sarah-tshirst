name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # URL/chave pública do Supabase e WhatsApp vêm de .env.production (versionado)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Cloudflare Workers (Static Assets), configuração em wrangler.jsonc
      - name: Deploy na Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Smoke test
        run: |
          set -euo pipefail
          # No primeiro deploy o certificado do domínio pode levar alguns minutos
          for i in $(seq 1 20); do
            if page="$(curl -fsS --connect-timeout 15 -A "Mozilla/5.0 (compatible; SarahDeployBot/1.0)" \
                 https://sarahcreations.i7dev.com.br/commande)"; then
              echo "$page" | grep -q "Sarah Nani" && echo "ok" && exit 0
            fi
            echo "tentativa $i: ainda não respondeu, aguardando..."
            sleep 15
          done
          echo "::error::sarahcreations.i7dev.com.br não respondeu com o site" >&2
          exit 1
